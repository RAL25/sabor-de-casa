version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sabor-de-casa-db
    restart: always
    environment:
      POSTGRES_USER: sabor_user
      POSTGRES_PASSWORD: sabor_password
      POSTGRES_DB: sabor_de_casa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: sabor-de-casa-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
